[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isage-benchmark-agent"
version = "0.1.0.1"
description = "SAGE Benchmark Agent - Agent capability evaluation framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "IntelliStream Team", email = "shuhao_zhang@hust.edu.cn" },
]
keywords = [
    "sage",
    "benchmark",
    "agent",
    "tool-selection",
    "planning",
    "evaluation",
    "intellistream",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # SAGE dependencies from PyPI
    "isage-common",
    "isage-libs",  # For agent interfaces if needed
    
    # Core dependencies
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0,<2.3.0",
    
    # CLI dependencies
    "typer>=0.15.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
]

license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff==0.14.6",
    "pre-commit>=3.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

all = [
    "isage-benchmark-agent[dev]",
]

[project.urls]
Homepage = "https://github.com/intellistream/sage-agent-benchmark"
Documentation = "https://github.com/intellistream/sage-agent-benchmark#readme"
Repository = "https://github.com/intellistream/sage-agent-benchmark"
Issues = "https://github.com/intellistream/sage-agent-benchmark/issues"

[project.scripts]
sage-agent-bench = "sage.benchmark.benchmark_agent.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sage*"]
namespaces = true

[tool.setuptools.package-data]
"sage.benchmark.benchmark_agent" = [
    "config/*.yaml",
    "data/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",   # Line too long
    "F401",   # Unused imports
    "F841",   # Unused local variable
]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--verbose",
    "-ra",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/sage"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py311']
